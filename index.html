<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Hồn Việt 3D: đấu trường danh tướng Việt Nam, dùng vũ khí vui nhộn đánh quái vật phương Tây, farm vàng mua trang bị." />
    <title>Hồn Việt 3D | Đấu Trường Danh Tướng</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23c8963e'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%232a1c12'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23c8963e'/%3E%3C/svg%3E" />
  </head>
  <body>
    <canvas id="c" tabindex="0" inputmode="none"></canvas>
    <div id="ui">
      <section id="lobby" class="screen hidden"></section>
      <section id="online" class="screen hidden"></section>
      <div id="gamechat" class="hidden"><div id="gc-log"></div><input id="gc-input" class="hidden" maxlength="200" placeholder="Gõ tin nhắn rồi nhấn Enter" autocomplete="off" /></div>

      <div id="loading-screen">
        <div class="loading-content">
          <div class="loading-drum-wrap">
            <svg class="loading-drum" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
              <circle cx="50" cy="50" r="46" fill="none" stroke="#c8963e" stroke-width="2" stroke-dasharray="4 2" />
              <circle cx="50" cy="50" r="38" fill="none" stroke="#ffd24a" stroke-width="1.5" />
              <polygon points="50,18 53,42 77,38 58,50 72,70 50,58 28,70 42,50 23,38 47,42" fill="#c8963e" />
              <circle cx="50" cy="50" r="10" fill="#2a1c12" stroke="#ffd24a" stroke-width="2" />
              <circle cx="50" cy="50" r="4" fill="#ffd24a" />
            </svg>
            <div class="loading-glow"></div>
          </div>
          <div class="loading-title">HỒN VIỆT 3D</div>
          <div class="loading-sub">ĐẤU TRƯỜNG DANH TƯỚNG</div>
          <div class="loading-bar-wrap">
            <div class="loading-bar"><div class="loading-bar-fill" id="loading-bar-fill"></div></div>
            <div class="loading-bar-meta">
              <span class="loading-text" id="loading-text">Đang nạp bối cảnh chiến trường 3D...</span>
              <span class="loading-pct" id="loading-pct">0%</span>
            </div>
          </div>
          <div class="loading-tip" id="loading-tip"></div>
        </div>
      </div>

      <section id="hud" class="hidden">
        <!-- GÓC TRÊN TRÁI: VÀNG, HẠ QUÁI & BẢNG CHỈ SỐ NHÂN VẬT (THAY THẾ CHO HÌNH 2) -->
        <div class="hud-tl">
          <div class="hud-name hidden" id="hud-name"></div>
          <div class="chips"><span id="hud-gold"></span><span id="hud-run"></span><span id="hud-kills"></span></div>
          <div class="team hidden" id="hud-team"></div>
          <div class="bar hp hidden"><i id="hp-fill"></i><span id="hp-text"></span></div>
          <div class="bar xp hidden"><i id="xp-fill"></i><span id="xp-text"></span></div>

          <!-- BẢNG CHỈ SỐ BÊN TRÊN GÓC TRÁI (HÌNH 1) -->
          <div class="lol-stats-box" id="lol-stats-box">
            <div class="lol-stat-item" title="Sát Thương Đòn Đánh"><span class="lol-stat-icon">🗡️</span><b id="lol-stat-dmg">120</b></div>
            <div class="lol-stat-item" title="Tốc Độ Đánh"><span class="lol-stat-icon">⚡</span><b id="lol-stat-atkspd">1.00</b></div>
            <div class="lol-stat-item" title="Giáp (Giảm Sát Thương)"><span class="lol-stat-icon">🛡️</span><b id="lol-stat-def">0%</b></div>
            <div class="lol-stat-item" title="Tỉ Lệ Chí Mạng"><span class="lol-stat-icon">💥</span><b id="lol-stat-crit">5%</b></div>
            <div class="lol-stat-item" title="Tốc Độ Di Chuyển"><span class="lol-stat-icon">👟</span><b id="lol-stat-spd">350</b></div>
            <div class="lol-stat-item" title="Giảm Hồi Chiêu"><span class="lol-stat-icon">⏳</span><b id="lol-stat-cdr">0%</b></div>
          </div>

          <div class="hud-cards hidden" id="hud-cards"></div>
        </div>
        <div class="hud-tr">
          <div class="hud-wave" id="hud-wave"></div>
          <div class="hud-hazard hidden" id="hud-hazard"></div>
          <div class="hud-hint hidden" id="hud-hint"></div>
          <canvas id="minimap" width="184" height="184" aria-label="Bản đồ nhỏ"></canvas>
        </div>
        <div class="boss hidden" id="boss">
          <div class="boss-name" id="boss-name"></div>
          <div class="bar boss"><i id="boss-fill"></i></div>
        </div>

        <!-- Ô NÂNG CẤP BÊN TRÁI MÀN HÌNH (KHÔNG PAUSE GAME KHI LÊN CẤP) -->
        <div class="side-levelup-wrap hidden" id="side-levelup-wrap">
          <button class="lvl-btn" id="side-levelup-btn" title="Có nâng cấp mới! Bấm hoặc nhấn phím B để chọn">
            <span class="lvl-btn-medal" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 3l-7 7h4.5v8h5v-8H19z"/></svg>
              <span class="lvl-btn-lv" id="side-levelup-lv">1</span>
            </span>
            <span class="lvl-btn-text">
              <b>LÊN CẤP</b>
              <small id="side-levelup-hint">Chọn nâng cấp</small>
            </span>
            <span class="lvl-btn-count" id="side-levelup-count">+1</span>
            <kbd class="lvl-btn-key">B</kbd>
          </button>
          <div class="side-levelup-popover lvl-pop hidden" id="side-levelup-popover">
            <div class="lvl-pop-head">
              <b>CHỌN MỘT NÂNG CẤP</b>
              <small>Phím 1 · 2 · 3 hoặc bấm vào thẻ · B để đóng</small>
            </div>
            <div class="lvl-pop-cards" id="side-cards-container"></div>
          </div>
        </div>

        <!-- THANH ĐIỀU KHIỂN CHÍNH (BOTTOM-CENTER): CHỈ GỒM ẢNH TƯỚNG VÀ BỘ CHIÊU THỨC -->
        <div class="lol-hud-bar" id="lol-hud-bar">
          <!-- AVATAR TRÒN VIỀN KIM LOẠI VÀNG VỚI CẤP ĐỘ -->
          <div class="lol-champ-wrap" id="lol-champ-wrap">
            <div class="lol-portrait-ring">
              <img id="lol-avatar-img" class="lol-avatar-img" alt="Tướng" />
              <div class="lol-avatar-fallback hidden" id="lol-avatar-fallback">👑</div>
            </div>
            <div class="lol-lvl-circle" id="lol-level-badge">1</div>
          </div>

          <!-- KHUNG KỸ NĂNG VÀ THANH MÁU / KINH NGHIỆM (GIỐNG LOL HÌNH 1) -->
          <div class="lol-action-panel">
            <!-- 4 Ô KỸ NĂNG: ĐÁNH THƯỜNG, LƯỚT, E, Q -->
            <div class="lol-skills-group">
              <!-- Ô 1: Đánh thường -->
              <div class="lol-skill-slot" id="cd-atk" title="Đòn Đánh Thường (Chuột trái)">
                <div class="lol-skill-box">
                  <img id="img-skill-atk" class="lol-skill-img" src="/skills/atk.png" alt="Đánh Thường" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" />
                  <div class="lol-skill-fallback" id="fb-skill-atk">⚔️</div>
                  <div class="lol-cd-sweep" id="cd-atk-sweep"></div>
                </div>
                <div class="lol-skill-key">Chuột T</div>
                <b id="cd-atk-name" class="hidden"></b>
              </div>

              <!-- Ô 2: Lướt (Dash) -->
              <div class="lol-skill-slot" id="cd-dash" title="Lướt Tránh Đòn (Space / Shift)">
                <div class="lol-skill-box">
                  <img id="img-skill-dash" class="lol-skill-img" src="/skills/dash.png" alt="Lướt" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" />
                  <div class="lol-skill-fallback" id="fb-skill-dash">💨</div>
                  <div class="lol-cd-sweep" id="cd-dash-sweep"></div>
                  <div class="lol-cd-sec" id="cd-dash-sec"></div>
                </div>
                <div class="lol-skill-key">Space</div>
              </div>

              <!-- Ô 3: Kỹ năng E -->
              <div class="lol-skill-slot" id="cd-e" title="Kỹ Năng E">
                <div class="lol-skill-box">
                  <img id="img-skill-e" class="lol-skill-img" src="" alt="Kỹ Năng E" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" />
                  <div class="lol-skill-fallback" id="fb-skill-e">✨</div>
                  <div class="lol-cd-sweep" id="cd-e-sweep"></div>
                  <div class="lol-cd-sec" id="cd-e-sec"></div>
                </div>
                <div class="lol-skill-key">E</div>
                <b id="cd-e-name" class="hidden"></b>
              </div>

              <!-- Ô 4: Chiêu cuối Q (Ultimate) -->
              <div class="lol-skill-slot ult" id="cd-ult" title="Chiêu Cuối Q">
                <div class="lol-skill-box">
                  <img id="img-skill-ult" class="lol-skill-img" src="" alt="Chiêu Cuối Q" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" />
                  <div class="lol-skill-fallback" id="fb-skill-ult">🐉</div>
                  <div class="lol-cd-sweep" id="cd-ult-sweep"></div>
                  <div class="lol-cd-sec" id="cd-ult-sec"></div>
                </div>
                <div class="lol-skill-key">Q</div>
                <b id="cd-ult-name" class="hidden"></b>
              </div>
            </div>

            <!-- THANH MÁU (XANH LÁ) & THANH KINH NGHIỆM (XANH DƯƠNG) (GIỐNG LOL HÌNH 1) -->
            <div class="lol-vital-bars">
              <div class="lol-bar-track hp">
                <div class="lol-bar-fill hp" id="lol-hp-fill"></div>
                <span class="lol-bar-text" id="lol-hp-text">100 / 100</span>
              </div>
              <div class="lol-bar-track xp">
                <div class="lol-bar-fill xp" id="lol-xp-fill"></div>
                <span class="lol-bar-text" id="lol-xp-text">Cấp 1</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Khung tướng cũ tương thích ngược -->
        <div class="hud-bottom-dock hidden" id="hud-bottom-dock">
          <div class="hero-frame" id="hero-frame">
            <div class="hero-avatar" id="hero-avatar"></div>
            <div class="hero-meta">
              <div class="hero-name-row">
                <b id="hero-name">Danh Tướng</b>
                <span class="hero-lvl-badge" id="hero-lvl-badge">Cấp 1</span>
              </div>
              <small id="hero-title">Đại Vương</small>
              <div class="hero-cast-hint" id="hero-cast-hint"></div>
            </div>
          </div>
          <div class="hero-deck-wrap">
            <div class="deck-label">Bộ nâng cấp</div>
            <div class="hero-deck" id="hero-deck">
              <span class="deck-empty">Chưa có nâng cấp</span>
            </div>
          </div>
        </div>
      </section>

      <div id="cards" class="hidden"></div>
      <div id="pop-layer"></div>
      <div id="banner" class="hidden"></div>
      <div id="modal" class="modal hidden"></div>
    </div>
    <noscript>Game cần JavaScript để chạy.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
