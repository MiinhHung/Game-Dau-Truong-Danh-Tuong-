<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Hồn Việt 3D: đấu trường danh tướng Việt Nam, dùng vũ khí vui nhộn đánh quái vật phương Tây, farm vàng mua trang bị." />
    <title>Hồn Việt 3D | Đấu Trường Danh Tướng</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23c8963e'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%232a1c12'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23c8963e'/%3E%3C/svg%3E" />
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="ui">
      <section id="lobby" class="screen"></section>
      <section id="online" class="screen hidden"></section>
      <div id="gamechat" class="hidden"><div id="gc-log"></div><input id="gc-input" class="hidden" maxlength="200" placeholder="Gõ tin nhắn rồi nhấn Enter" autocomplete="off" /></div>

      <section id="hud" class="hidden">
        <div class="hud-tl">
          <div class="hud-name" id="hud-name"></div>
          <div class="bar hp"><i id="hp-fill"></i><span id="hp-text"></span></div>
          <div class="bar xp"><i id="xp-fill"></i><span id="xp-text"></span></div>
          <div class="hud-cards hidden" id="hud-cards"></div>
          <div class="chips"><span id="hud-gold"></span><span id="hud-run"></span><span id="hud-kills"></span></div>
          <div class="team hidden" id="hud-team"></div>
        </div>
        <div class="hud-tr">
          <div class="hud-wave" id="hud-wave"></div>
          <div class="hud-hazard hidden" id="hud-hazard"></div>
          <div class="hud-hint hidden" id="hud-hint"></div>
          <canvas id="minimap" width="184" height="184" aria-label="Bản đồ nhỏ"></canvas>
        </div>
        <div class="boss hidden" id="boss">
          <div class="boss-name" id="boss-name"></div>
          <div class="bar boss"><i id="boss-fill"></i></div>
        </div>
        <div class="hud-bottom">
          <div class="slot" id="cd-atk"><kbd>Chuột trái</kbd><b id="cd-atk-name"></b></div>
          <div class="slot" id="cd-dash"><kbd>Shift</kbd><b>Lướt</b></div>
          <div class="slot" id="cd-e"><kbd>E</kbd><b id="cd-e-name"></b></div>
          <div class="slot" id="cd-ult"><kbd>Q</kbd><b id="cd-ult-name"></b></div>
        </div>
      </section>

      <div id="cards" class="hidden"></div>
      <div id="pop-layer"></div>
      <div id="banner" class="hidden"></div>
      <div id="modal" class="modal hidden"></div>
    </div>
    <noscript>Game cần JavaScript để chạy.</noscript>
    <script type="module" src="/src/arena3d/main.ts"></script>
  </body>
</html>
